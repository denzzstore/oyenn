name: Build Oyen APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Scaffold android + izin
        run: |
          set -e
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          flutter create --platforms=android --project-name oyen --org ai.venice .

          python3 - <<'EOF'
          from pathlib import Path

          # 1. AndroidManifest.xml
          manifest_path = Path("android/app/src/main/AndroidManifest.xml")
          manifest = manifest_path.read_text(encoding="utf-8")

          perms_and_queries = """    <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <queries>
                  <intent><action android:name="android.speech.RecognitionService"/></intent>
                  <intent><action android:name="android.intent.action.TTS_SERVICE"/></intent>
              </queries>
          """
          if "android.permission.RECORD_AUDIO" not in manifest:
              manifest = manifest.replace("<application", perms_and_queries + "<application", 1)

          manifest = manifest.replace('android:label="oyen"', 'android:label="Oyen"')
          manifest_path.write_text(manifest, encoding="utf-8")

          # 2. build.gradle.kts (compileSdk, minSdk, targetSdk)
          gradle_app = Path("android/app/build.gradle.kts")
          if gradle_app.exists():
              txt = gradle_app.read_text(encoding="utf-8")
              txt = txt.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 35")
              txt = txt.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              txt = txt.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 35")
              gradle_app.write_text(txt, encoding="utf-8")

          # 3. gradle.properties
          props_path = Path("android/gradle.properties")
          props = props_path.read_text(encoding="utf-8") if props_path.exists() else ""
          additions = [
              "kotlin.jvm.target.validation.mode=warning",
              "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g",
          ]
          for line in additions:
              if line not in props:
                  props += ("\n" if props and not props.endswith("\n") else "") + line + "\n"
          props_path.write_text(props, encoding="utf-8")
          EOF

      - run: flutter pub get

      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --no-pub 2>&1 | tee build.log

      - name: Ringkas error
        if: failure()
        run: |
          echo "=== RINGKASAN ERROR ==="
          grep -iE "what went wrong|error:|failed|caused by|exception|requires|not found|kotlin|settings\.gradle" build.log | tail -n 50 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: oyen-apk
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build.log
